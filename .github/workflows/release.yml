name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # release notes are generated from history
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate skill
        run: python tools/validate_skill.py

      # A published zip whose SKILL.md disagrees with its tag is the failure
      # worth spending CI on: the artifact outlives the mistake. A prerelease
      # suffix (v0.8.0-rc1) is stripped first, so dry runs are possible without
      # touching the frontmatter.
      - name: Package at the tagged version
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/package_skill.py --expect-version "${version%%-*}"

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/dungeon-world-gm-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
