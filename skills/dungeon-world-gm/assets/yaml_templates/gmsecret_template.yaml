# Template gmsecret. Copy to <campaign_slug>_gmsecret.yaml and fill in as the
# campaign develops. This is the PLAIN working copy - never share this file
# directly with the player(s). Only the rot13'd .txt (via session_save.py)
# should ever leave the sandbox.
#
# The schema/format of this file is not strictly limited to these fields!
# Anything can be added to it as needed.

campaign: ""
# The session currently being played. The first session is 1, never 0, so a
# brand-new campaign starts here at 1. No script touches this: session_load.py
# only reports it and session_save.py only reads it to name the zip, which means
# Campaign_s3.zip contains session_number: 3 and re-running either is harmless.
# It is advanced by one explicit yamledit call at the START of a new session,
# once the GM has confirmed that is what the player wants.
session_number: 1

players:
  - { name: "", file: "" } # file: the character yaml, e.g. ragnar_warrior.yaml

fronts:
  - name: ""
    level: adventure # adventure | campaign
    dangers:
      - name: ""
        type: "" # e.g. "Ambitious Organization (Cabal)"
        impulse: ""
        impending_doom: ""
        portents:
          - { text: "", checked: false }
    stakes: []
    cast:
      - { name: "", role: "" }

custom_moves: [] # list of {trigger, effect}

session_log: [] # list of {session: N, recap: "..."}

pause_state:
  situation: "" # freeform, multi-line ok with |
  # Live, unresolved hooks ONLY - a working set, not a history. Prune on sight:
  # the moment a thread resolves, remove it. A thread resolves when it is
  #   - answered or acted on (the party did the thing, or learned the answer)
  #   - superseded, where several clues collapse into one larger thread that
  #     replaces them (remove all of the old ones, add the new one)
  #   - a dead end (the lead went nowhere, the NPC died, the party walked away)
  # Removing is safe because anything that mattered is recorded in `deeds`
  # below. If a thread has sat untouched for two sessions and nobody has shown
  # interest, it is a dead end - cut it. A list that only grows stops being
  # readable and stops being used.
  open_threads: []

# Append-only, sequential record of resolved threads: the campaign's history and
# the counterpart to open_threads. A deed is written at the moment a thread
# resolves, in the same edit that deletes the thread(s) it closes. Each one says
# who did it - naming both the PCs and any NPCs who helped - and what came of it,
# including consequences that outlast the deed itself. Prose, not a label:
#   - {session: 2, deed: "Fred and Joe solved the mystery of the disappearing
#      cattle in Cowsburg with Old Marta's help, and gained the gratitude of
#      the townsfolk"}
# One deed may close several threads at once when they turn out to be the same
# story. This is what makes pruning safe, and what a recap is answered from.
# Never rewrite or reorder past entries.
deeds: []

monster_types: [] # quick reference for monsters often encountered

# Scratch space for a fight in progress: live HP of each combatant, which does
# NOT belong in monster_types (static stat blocks) or npcs (persists between
# sessions). Clear this when the fight ends; anything that survived and matters
# later goes in npcs. Entries are freeform, e.g.
#   - {monster: "Ghoul (left)", hp: 9, notes: "took the torch to the face"}
active_combat: []

npcs: [] # named NPCs or monsters damaged but not dead yet

followers: [] # NPC henchmen followers

# geography data
# regions should say what other regions are adjacent n/s/e/w/ne/etc
# regions are composed of areas which are subdivisions of their region
# areas should also say what other areas are adjacent n/s/e/w/ne/etc and what region that area is (default same)
# Since regions contain nothing but their subset areas, only areas can have steadings and points_of_interest
# It is nonsensical for anything but an area to "only be in a region" without being in one of its areas.
# An area's own steadings/points_of_interest lists are NAME-ONLY pointers - just which
# steadings/points of interest exist in that area (schema restricts these to bare strings,
# no objects). All the actual detail (tags, prosperity, population, description, which area
# it's in, etc.) lives in the top-level steadings/points_of_interest lists below instead -
# that's the single source of truth; the area-level list is only an index into it.
# The "edge of the map" will be undefined, so if there is only one region it will have no adjacencies to other regions.
# Another region could be "a far off land" with no adjacencies until the characters discover the path there
# Areas need to have at least one adjacency to another area but can have multiple.
# so this will roughly look like:
# regions:
#   region_name:
#     (details about region)
#     adjacencies:          # keyed by direction; a list if two lie that way
#       n: other_region_name
#       sw: [one_region, another_region]
#     areas:
#       (areas contained in the region)
#       area_name:
#         (details about the area including what points_of_interest and steadings are there)
#         adjacencies:      # same, and an area may lie across a region border
#           e: other_area_name
#           n: {area: far_area_name, region: other_region_name}
#           s: [area_one, area_two]

regions: {} # mapping of region_name -> region, per the sketch above

# Full-detail records for settlements that have been generated. Each entry
# should say which area it's in and carry whatever else is worth tracking
# (tags, prosperity, population, notes) - the matching area's own `steadings`
# list should just hold this entry's name as a pointer, e.g.:
#   steadings:
#     - name: Cowsburg
#       area: area_name
#       tags: [Market, Farming]
#       prosperity: moderate
#       population: steady
steadings: []

# Full-detail records for non-settlement locations (dungeons, ruins, lairs,
# etc.), same name-pointer-from-the-area / full-record-here split as steadings
# above, e.g.:
#   points_of_interest:
#     - name: The Sunken Chapel
#       area: area_name
#       kind: dungeon
#       notes: half-flooded, said to be haunted
points_of_interest: []

current_location:
  party: # the default for all player characters
    region: ""
    area: ""
    site: "" # steading, poi, or other
    point: "" # room/building or other immediate surrounding
#  charname:           # only exists when a character or possibly NPC is in a different location from the party
#    point: ""        # only track differences, no need to repeat region if in same region as party etc

notes: ""
