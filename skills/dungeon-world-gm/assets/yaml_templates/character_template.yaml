# Template character sheet. Copy to <name>_<class>.yaml (lowercase, e.g. ragnar_warrior.yaml)
# and fill in. Keep this schema stable across characters so yamledit.pyz paths
# (hp.current, stats.str.score, etc.) work the same way for every PC.
# Note: this schema is NOT strictly limited to these fields! Other fields can be added as needed.

name: ""
class: ""
level: 1
xp: 0
race: ""
gender: ""
alignment: ""
look: [] # e.g. [Hard Eyes, Wild Hair, Scarred Skin, Built Body]
bonds: []

# Set score and mod together in one edit - nothing validates one against the
# other. mod: 1-3:-3, 4-5:-2, 6-8:-1, 9-12:0, 13-15:+1, 16-17:+2, 18:+3
stats:
  str: { score: 0, mod: 0 }
  dex: { score: 0, mod: 0 }
  con: { score: 0, mod: 0 }
  int: { score: 0, mod: 0 }
  wis: { score: 0, mod: 0 }
  cha: { score: 0, mod: 0 }

hp: { current: 0, max: 0 }
# the below changed and may need fixing in pre-existing yaml files if schema validation fails
debilities:
  tags: [] # any of: weak, shaky, sick, stunned, confused, scarred
  comment: "" # prose narrative description of health condition, what, where, when, how etc.

moves:
  starting: []
  advanced: []

# Class-specific extras - only use what applies to the class, then delete others. That is, delete unused keys after character creation.
class_specifics:
  barbarian_variant: "" # "Unencumbered, Unharmed" or "Full Plate And Packing Steel" - Barbarian
  herculean_appetites: [] # Barbarian
  signature_weapon: # fighter
    base_type: "" # sword, axe, etc
    range: "" # range tag like close, etc
    enhancements: ["", ""]
    look: ""
  paladin_quest:
    objective: "" # Paladin
    boons: ["", ""]
    vows: [""]
  animal_companion: # Ranger
    name: ""
    species: ""
    ferocity: 0
    cunning: 0
    armor: 0
    instinct: 0
    strengths: []
    trainings: []
    weaknesses: []
  safe_poisons: [""] # Thief
  deity: "" # Cleric/Paladin
  domain: "" # Cleric
  precept: "" # Cleric
  petition: "" # Cleric
  land: [""] # Druid - can have two lands if Elf
  tell: "" # Druid
  # Clerics and Wizards: always have all of their class rotes/cantrips owned and prepared, so they do not need to be tracked here.
  # Clerics: do not need to physically own spell documents to be able to prepare spells.
  # Clerics: all permitted cleric spells are always available for preparation by clerics, but they can only prepare a limited number.
  # Clerics: Use 'spellbook' to record which spells they have prepared at the moment even though they have no actual spellbook.
  # Wizards: must physically own a spell (stored in their spellbook) before they can prepare it.
  # Wizards: Use the spellbook list to keeps track of which spells the wizard actually owns, in addition to marking which ones are prepared right now.
  # Wizards: Can own spells that they don't have prepared, and it is important to keep track of which ones they own. So do not delete a spell from their spellbook simple because it is not prepared.
  # Clerics, Wizards, any spell user: If a spell is revoked, that means prepared now = false and it must be re-prepared using a downtime move to be used again.
  spellbook: [{ name: "", level: 1, prepared: true }] # Even though clerics have no book of spells, use this to track which ones they have prepared.

load: { current: 0, max: 0 }
gear: []
coin: 0 # bare integer, NOT "45 coin" - a string blocks yamledit's `coin -12` delta

notes: ""
