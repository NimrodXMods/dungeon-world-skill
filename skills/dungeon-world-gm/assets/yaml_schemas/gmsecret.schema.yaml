# Describes assets/yaml_templates/gmsecret_template.yaml.
#
# Selectively open: a campaign grows new fields constantly, so the top level
# and most collections accept them, while the small fixed record shapes are
# closed so a typo is an error rather than a silent new key.

$schema: "http://json-schema.org/draft-07/schema#"
title: "Dungeon World GM secret file"
type: object
additionalProperties: true

required: [campaign_slug, session_number, regions]

properties:
  campaign_slug: { type: string }
  session_number: { type: integer, minimum: 1 }

  # Closed: a player entry is always exactly a name and a character file.
  players:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, file]
      properties:
        name: { type: string }
        file: { type: string }

  fronts:
    type: array
    items:
      type: object
      # Open: fronts accumulate campaign-specific notes as play goes on.
      additionalProperties: true
      required: [name, level]
      properties:
        name: { type: string }
        level:
          type: string
          enum: [adventure, campaign]
        stakes: { type: array }
        cast:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              name: { type: string }
              role: { type: string }
        dangers:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [name]
            properties:
              name: { type: string }
              type: { type: string }
              impulse: { type: string }
              impending_doom: { type: string }
              # Closed: a portent is a line of text and whether it has come
              # to pass. `chekced` must fail, not become a third field.
              portents:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [text, checked]
                  properties:
                    text: { type: string }
                    checked: { type: boolean }

  custom_moves: { type: array }
  session_log: { type: array }

  pause_state:
    type: object
    additionalProperties: true
    properties:
      situation: { type: string }
      # A working set of live hooks, not a history: entries are removed as soon
      # as they resolve, are superseded, or dead-end. The permanent record is
      # `deeds`, which is what makes that pruning safe.
      open_threads: { type: array }
    # `current_location` is the authoritative record of where everyone is. A
    # second copy here would only drift, and pause_state is otherwise open, so
    # this is the only way to keep it out.
    not:
      required: [location]

  # Append-only record of resolved threads, oldest first. Each entry names who
  # acted (PCs and any NPCs who helped) and what resulted. Open items: the
  # useful content is prose and the surrounding detail varies. Never rewrite
  # past entries - this is what `open_threads` is pruned *into*, so losing it
  # would make pruning lossy.
  deeds:
    type: array
    items:
      type: object
      additionalProperties: true

  monster_types: { type: array }

  # Live HP for a fight in progress, cleared when it ends. Open items: what a
  # GM needs to track mid-fight varies (hp, position, conditions, which of
  # three identical goblins this is), and a closed shape here would just force
  # the tracking back out into ad-hoc fields elsewhere.
  active_combat:
    type: array
    items:
      type: object
      additionalProperties: true

  npcs: { type: array }
  followers: { type: array }

  regions:
    type: object
    # Region names are arbitrary, so the keys are matched by pattern rather than
    # listed. additionalProperties: false makes any non-matching key an error.
    additionalProperties: false
    patternProperties:
      "^.+$":
        $ref: "#/definitions/region"

  # Where everyone currently is. `party` is the baseline; any other key is a
  # character or NPC standing somewhere else, recorded as a partial override.
  # Note `additionalProperties` rather than the `patternProperties` idiom used
  # by `regions`: only additionalProperties is excluded by `properties`, so a
  # "^.+$" pattern here would match `party` too and force it to satisfy both
  # schemas at once.
  current_location:
    type: object
    required: [party]
    properties:
      party: { $ref: "#/definitions/location" }
    additionalProperties: { $ref: "#/definitions/location_override" }

  steadings: { type: array }
  points_of_interest: { type: array }
  notes: { type: string }

definitions:
  direction:
    type: string
    enum: [n, s, e, w, ne, se, nw, sw]

  region:
    type: object
    # Open: prose details about the region vary and get added freely.
    additionalProperties: true
    properties:
      # Keyed by direction: "what lies to the north". propertyNames is what
      # validates the keys against the direction enum - `properties` cannot,
      # since that matches a property literally named "enum".
      adjacencies:
        type: object
        propertyNames: { $ref: "#/definitions/direction" }
        additionalProperties: { $ref: "#/definitions/region_adjacency" }
      areas:
        type: object
        additionalProperties: false
        patternProperties:
          "^.+$": { $ref: "#/definitions/area" }
    # Steadings and points_of_interest belong to areas, which are specific
    # enough to place them. A region is open, so this is the only way to keep
    # them out of it.
    not:
      anyOf:
        - { required: [steadings] }
        - { required: [points_of_interest] }

  area:
    type: object
    additionalProperties: true
    properties:
      # Keyed by direction, as with regions above.
      adjacencies:
        type: object
        propertyNames: { $ref: "#/definitions/direction" }
        additionalProperties: { $ref: "#/definitions/area_adjacency" }
      steadings:
        type: array
        items: { type: string }
      points_of_interest:
        type: array
        items: { type: string }

  # Closed: the four levels of granularity, coarsest first. Nothing here can be
  # checked against `regions` - JSON Schema cannot reference sibling data - so a
  # misspelled region name still validates. A post-write check is the place to
  # catch that if it matters.
  location:
    type: object
    additionalProperties: false
    required: [region, area, site, point]
    properties:
      region: { type: string }
      area: { type: string }
      site: { type: string }
      point: { type: string }

  # A character elsewhere records only what differs from the party, so every
  # field is optional - but an empty override says nothing and is more likely a
  # half-finished edit than an intent.
  location_override:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      region: { type: string }
      area: { type: string }
      site: { type: string }
      point: { type: string }

  # What lies in one direction from a region: normally one region, but a border
  # can face two, so a list is allowed.
  region_adjacency:
    oneOf:
      - type: string
      - type: array
        items: { type: string }

  # Likewise for areas, which additionally may lie across a region border.
  area_adjacency:
    oneOf:
      - $ref: "#/definitions/area_reference"
      - type: array
        items: { $ref: "#/definitions/area_reference" }

  # An adjacent area is usually in the same region, so the common case is just
  # its name. Name a region explicitly to cross a border.
  area_reference:
    oneOf:
      - type: string
      - type: object
        additionalProperties: false
        required: [area]
        properties:
          area: { type: string }
          region:
            type: string
            description: "defaults to the containing region when omitted"
